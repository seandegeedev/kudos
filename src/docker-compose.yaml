services:
  app:
    build:
      context: .
      dockerfile: apps/kudos/Dockerfile
    depends_on:
      - db
    restart: always
    env_file:
      - .env
    ports:
      - "${NEXT_PORT}:3000"
    volumes:
      - source_app:/usr/local/src/kudos
    profiles: [prod, app]
  db:
    image: postgres:17.0-bookworm
    restart: always
    user: ${SYSTEM_OWNERSHIP}
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/kudos
    ports:
        - 5432:5432
    volumes:
        - ../data/db:/var/lib/postgresql/data/
    profiles: [prod, db-only, migrate]
  db-migrate:
    build:
      context: ./
      dockerfile: ./modules/database/Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - source_db-migrate:/usr/local/src/kudos
    profiles: [migrate]
  redis:
    image: redis:7.4.1
    restart: always
    ports:
        - 6379:6379
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    profiles: [prod, db-only]
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    user: ${SYSTEM_OWNERSHIP}
    ports:
      - "${PGADMIN_PORT}:8080"
    env_file:
      - .env
    environment:
      - "PGADMIN_LISTEN_PORT=8080"
      - "PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}"
      - "PGADMIN_CONFIG_LOGIN_BANNER='Kudos DB. Authorized users only.'"
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    profiles: [prod, db-only]
volumes:
  source_app:
  source_db-migrate:
  redis_data: